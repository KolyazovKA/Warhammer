version: "3.9"

services:

  wh-backend:
    container_name: wh-backend
    build:
      context: ..
      dockerfile: docker/WH.Backend.Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - ../.env
    volumes:
      - choma_db_data:/app/choma_db
      - files_data:/app/files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8081/docs')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  wh-frontend:
    container_name: wh-frontend
    build:
      context: ..
      dockerfile: docker/WH.Frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      wh-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  choma_db_data:
  files_data:
